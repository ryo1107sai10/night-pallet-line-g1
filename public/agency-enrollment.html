<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>エール マスター招待 | Night PRO LINE</title><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/agency-enrollment.mjs"></script></head><body>
<header><div class="header-inner"><span class="brand">Night <strong>PRO LINE</strong></span></div></header>
<main><section class="auth"><div class="panel"><h1>エールのマスター登録</h1><p id="enrollment-notice" role="status" aria-live="polite">招待リンクを確認しています…</p><form id="enrollment-form" class="stack" hidden>
  <p><strong>1. 登録情報を確認</strong></p><p id="enrollment-identity"></p><p id="enrollment-expiry" class="muted"></p>
  <div id="enrollment-factor-setup" hidden><p><strong>2. スマートフォンの認証アプリを設定</strong></p><p>ご本人の認証アプリでQRコードを読み取ってください。同じスマートフォンで開いている場合は、手動で時刻ベースの認証を登録できます。</p><img id="enrollment-qr" width="240" height="240" alt="本人の認証アプリ登録用QRコード"><details><summary>認証アプリに手動で登録する</summary><p>アカウント名：Night PRO LINE</p><label>設定キー<input id="enrollment-key" readonly autocomplete="off"></label><button type="button" id="enrollment-copy" class="secondary">設定キーをコピー</button></details></div>
  <p><strong id="password-heading">2. ご自身のパスワードを設定</strong></p><label>新しいパスワード（12文字以上）<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>パスワード（確認）<input name="confirmation" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label id="enrollment-factor" hidden>認証アプリの現在の6桁コード<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" disabled></label><button type="submit">本人の登録を完了する</button><p class="muted">登録後、現在のマスターが2名の引き継ぎを確定するとログインできるようになります。</p>
</form><a class="studio-link" href="/master/">エール管理画面へ</a></div></section></main></body></html>
