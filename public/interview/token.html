<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>面談予約 | Night PRO LINE</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/interview/calendar.css">
  <script type="module" src="/interview/token.mjs"></script>
</head>
<body>
  <header><div class="header-inner"><span class="brand">Night <strong>PRO LINE</strong></span></div></header>
  <main class="auth panel">
    <h1 id="heading">面談予約</h1>
    <p id="status" role="status" aria-live="polite">予約URLを確認しています。</p>
    <section id="fallback" class="panel" hidden>
      <h2>この予約URLは使えません</h2>
      <p id="fallback-reason"></p>
      <p>新しく予約を行う場合は、LINEのトーク画面メニューから再度「面談予約」をタップしてください。</p>
    </section>
    <section id="interview-notices" class="panel" hidden></section>
    <section id="workflow-form" class="panel" hidden></section>
    <section id="interview" hidden></section>
    <noscript>予約には JavaScript が必要です。</noscript>
  </main>
</body>
</html>
