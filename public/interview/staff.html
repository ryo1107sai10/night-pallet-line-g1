<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>面談枠の管理 | Night PRO LINE</title>
<link rel="stylesheet" href="./calendar.css">
<script type="module" src="./staff.mjs"></script>
</head>
<body class="interview-page">
<header class="interview-header"><a href="/staff/" id="back-to-admin">Night PRO LINE</a><a href="/operations/" id="back-to-operations">店舗運用</a><a href="/workflows/?use=recruitment" id="recruitment-operations">応募・選考</a></header>
<main id="interview" class="interview-app">
<header class="hero"><h1>面談枠の管理</h1><p>公開した枠は応募者がLINEから選べます。</p></header>
<div id="notice" class="notice" role="status" hidden></div>
<div class="columns">
<section class="box stack"><h2>面談スケジュール</h2><label class="field">店舗<select id="stores"></select></label><label><input type="checkbox" id="interviews-today" class="inline-check"> 今日の予約だけ表示</label><div id="slots"></div></section>
<div class="stack">
<section class="box stack"><h2>受付時間の設定</h2>
<form id="interview-hours" class="stack" hidden>
<div class="time-fields">
<label class="field">受付開始<select name="start" required></select></label>
<label class="field">受付終了<select name="end" required></select></label>
</div>
<p>30分刻みで選べます。受付時間外の枠は予約カレンダーに表示されません。確定済みの面談は保持します。</p>
<button type="submit" class="primary">受付時間を保存する</button>
</form></section>
<section class="box stack"><h2>面談枠を登録</h2>
<form id="new-slot" class="stack" hidden>
<label class="field">採用用公式アカウント<select name="channel" required></select></label>
<label class="field" id="host-field" hidden>面談担当者<select name="host"></select></label>
<label class="field">面談日<input type="date" name="date" required></label>
<div class="time-fields">
<label class="field">開始時刻<select name="time" required></select></label>
<label class="field">所要時間<select name="minutes"><option value="30">30分</option><option value="60">60分</option><option value="90">90分</option></select></label>
</div>
<label class="field">確定後に表示する会場案内<input name="instructions" maxlength="800" required></label>
<label><input type="checkbox" name="published" checked class="inline-check"> 予約カレンダーに公開する</label>
<button type="submit" class="primary">面談枠を登録する</button>
</form><p id="slot-help"></p>
</section>
<section class="box stack" id="slot-batch" hidden>
<h2>面談枠をまとめて公開</h2>
<form id="batch-form" class="stack">
  <label class="field">採用用公式アカウント<select name="channel" required></select></label>
  <label class="field" id="batch-host" hidden>面談担当者<select name="host"></select></label>
  <div class="time-fields">
    <label class="field">開始日<input type="date" name="first_day" required></label>
    <label class="field">終了日<input type="date" name="last_day" required></label>
  </div>
  <fieldset><legend>受付する曜日</legend><div class="weekday-options">
    <label><input type="checkbox" name="weekday" value="1" checked>月</label>
    <label><input type="checkbox" name="weekday" value="2" checked>火</label>
    <label><input type="checkbox" name="weekday" value="3" checked>水</label>
    <label><input type="checkbox" name="weekday" value="4" checked>木</label>
    <label><input type="checkbox" name="weekday" value="5" checked>金</label>
    <label><input type="checkbox" name="weekday" value="6">土</label>
    <label><input type="checkbox" name="weekday" value="0">日</label>
  </div></fieldset>
  <div class="time-fields">
    <label class="field">開始時刻<select name="start"></select></label>
    <label class="field">終了時刻<select name="end"></select></label>
  </div>
  <label class="field">1枠の所要時間<select name="minutes"></select></label>
  <label class="field">確定後に表示する会場案内<input name="instructions" maxlength="800" required></label>
  <button type="submit">公開前に確認する</button>
</form>
<div id="batch-preview" class="stack" aria-live="polite"></div>
</section>
<div id="interview-hosts" class="stack"></div><div id="availability" class="stack"></div></div></div>
</main>
</body>
</html>
