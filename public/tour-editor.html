<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画面ツアーを編集 | Night PRO LINE</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/tour.css">
  <script type="module" src="/static/tour-editor.mjs"></script>
</head>
<body>
  <header><div class="header-inner">
    <a href="/platform/" class="brand">Night <strong>PRO LINE</strong></a>
  </div></header>
  <main class="tour-editor">
    <div class="heading">
      <h1>画面ツアーを編集</h1>
      <a class="studio-link" href="/platform/">監督画面に戻る</a>
    </div>
    <p id="notice" role="status">読み込み中…</p>
    <form id="tour-editor" class="panel" hidden>
      <label>編集するツアー<select id="tour-select"></select></label>
      <p id="tour-version" class="muted"></p>
      <label>ツアーの名前<input id="tour-title" maxlength="80" required></label>
      <div id="tour-steps"></div>
      <button type="submit">プレビュー</button>
    </form>
    <dialog id="tour-preview" aria-labelledby="preview-heading">
      <h2 id="preview-heading">公開前のプレビュー</h2>
      <div id="preview-content"></div>
      <p id="preview-status" role="status"></p>
      <div class="actions">
        <button type="button" class="secondary" id="edit-again">編集に戻る</button>
        <button type="button" id="publish-tour">この内容を公開</button>
      </div>
    </dialog>
  </main>
</body>
</html>
