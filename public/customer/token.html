<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>来店予約・配信設定 | Night PRO LINE</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/customer/token.mjs"></script>
</head>
<body>
  <header><div class="header-inner"><span class="brand">Night <strong>PRO LINE</strong></span></div></header>
  <main class="auth panel">
    <h1 id="heading">来店予約・配信設定</h1>
    <p id="status" role="status" aria-live="polite">URLを確認しています。</p>
    <section id="fallback" class="panel" hidden>
      <h2>このURLは使えません</h2>
      <p id="fallback-reason"></p>
      <p>新しく開く場合は、LINEのトーク画面メニューから再度「来店予約・設定」をタップしてください。</p>
    </section>
    <section id="workflow-form" class="panel" hidden></section>
    <section id="customer" hidden>
      <h2 id="store-name"></h2>
      <form id="preferences">
        <h3>LINEで受け取る案内</h3>
        <p>同意した種類の案内を、この店舗の公式アカウントから受け取ります。選択はいつでも変更できます。</p>
        <label class="check"><input type="checkbox" name="service">予約確認などの業務案内を受け取る</label>
        <label class="check"><input type="checkbox" name="marketing">店舗からの販促案内を受け取る</label>
        <label class="check"><input type="checkbox" name="stop">LINEの配信をすべて停止</label>
        <button type="submit">配信設定を保存</button>
      </form>
      <form id="reservation">
        <h3>来店予約の申込み</h3>
        <label>希望日時<select name="slot" required></select></label>
        <label>人数<input name="party" type="number" min="1" max="200" value="1" required></label>
        <button type="submit">仮受付を申し込む</button>
      </form>
      <section><h3>自分の予約</h3><div id="my-bookings"></div></section>
    </section>
    <noscript>この画面には JavaScript が必要です。</noscript>
  </main>
</body>
</html>
