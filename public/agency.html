<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>店舗運用 | Night PRO LINE</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/agency.mjs"></script>
</head>
<body>
  <header><div class="header-inner">
    <a class="brand" href="/master/">Night <strong>PRO LINE</strong></a>
    <span id="agency-account"></span>
  </div></header>
  <main>
    <div class="heading">
      <h1 id="agency-name">店舗運用</h1>
      <button type="button" id="agency-logout" class="secondary">ログアウト</button>
    </div>
    <p id="agency-status" role="status"></p>
    <section id="agency-stores" class="panel" hidden>
      <label>操作する店舗 <select id="agency-store"></select></label>
    </section>
    <div class="controls" id="agency-tools" hidden>
      <section id="agency-steps" class="panel">
        <h2>ステップ配信</h2>
        <p>店舗の公式LINEで使うシナリオを作成・編集します。</p>
        <a class="studio-link" id="agency-studio">ステップ配信を開く</a>
      </section>
      <section id="agency-interview" class="panel">
        <h2>面談予約</h2>
        <p>Googleカレンダーの連携、空き枠、受付時間を管理します。</p>
        <div class="actions"><a class="studio-link" id="agency-calendar">面談枠とカレンダー</a><a class="studio-link" id="agency-inbox">採用LINEの受信箱・通知履歴</a></div>
      </section>
    </div>
  </main>
</body>
</html>
