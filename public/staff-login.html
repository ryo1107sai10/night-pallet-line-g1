<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Night PRO LINE</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/admin.mjs"></script>
</head>
<body>
  <header><div class="header-inner"><span class="brand">Night <strong>PRO LINE</strong></span></div></header>
  <main id="main">
    <p id="notice" role="status" aria-live="polite"></p>
    <section id="auth" class="auth">
      <form id="login" class="panel">
        <h1>管理画面にログイン</h1>
        <label>法人ID<input name="tenant" autocomplete="organization" required></label>
        <label>メールアドレス<input name="email" type="email" autocomplete="username" required></label>
        <label>パスワード<input name="password" type="password" autocomplete="current-password" required></label>
        <label id="login-factor">認証アプリの6桁のコード<input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label>
        <button type="submit">ログイン</button>
        <button type="button" class="secondary" id="show-activate">招待を受け取った方</button>
      </form>
      <form id="activate" class="panel" hidden>
        <h1>招待を有効にする</h1>
        <p>受け取った設定キーを認証アプリに登録し、表示された6桁のコードを入力してください。</p>
        <label>招待コード<input name="invite" autocomplete="off" required></label>
        <label>新しいパスワード<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
        <label>認証コード<input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label>
        <button type="submit">有効にする</button>
        <button type="button" class="secondary" id="show-login">ログイン画面へ</button>
      </form>
    </section>
  </main>
</body>
</html>
