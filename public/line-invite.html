<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>公式LINEの管理者招待 | Night PRO LINE</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/line-invite.mjs"></script>
</head>
<body>
  <header><div class="header-inner"><span class="brand">Night <strong>PRO LINE</strong></span></div></header>
  <main class="invite-guide">
    <section class="panel">
      <h1>公式LINEの管理者招待</h1>
      <p id="guide-context" class="muted" hidden></p>
      <p id="guide-status" role="status">案内を読み込んでいます。</p>
      <div id="guide-instructions" hidden>
        <ol class="guide-steps">
          <li>
            <strong>店舗の公式LINEを開く</strong>
            <p>LINE公式アカウントの管理画面で、対象の店舗を選んでください。</p>
            <a class="studio-link" href="https://manager.line.biz/" target="_blank" rel="noopener noreferrer">LINE公式の管理画面を開く ↗</a>
          </li>
          <li>
            <strong>管理者の招待URLを発行する</strong>
            <p>「設定」から「権限管理」（アプリでは「権限」）を開き、「メンバーの追加」で「管理者」を選んでURLを発行・コピーします。</p>
            <a href="https://www.lycbiz.com/jp/manual/OfficialAccountManager/account-settings_permission/" target="_blank" rel="noopener noreferrer">LINE公式の画像付き手順 ↗</a>
          </li>
          <li>
            <form id="guide-form">
              <label for="invitation">コピーした招待URLを貼り付ける</label>
              <input id="invitation" name="invitation" type="url" inputmode="url" autocomplete="off" maxlength="210"
                placeholder="https://manager.line.biz/invitation/…" required>
              <button type="submit">管理会社に招待URLを渡す</button>
            </form>
            <p class="muted">LINEの招待URLは発行から24時間有効です。</p>
          </li>
        </ol>
      </div>
    </section>
  </main>
</body>
</html>
